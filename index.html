<html lang="pt-BR">
<head>

  <meta name="theme-color" content="#0A1A2E" />

  <style>
    *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
    :root{
      --orange:#ff6600;--orange-light:#ff8533;--orange-glow:rgba(255,102,0,0.12);
      --petrol:#2e5b76;--petrol-deep:#0a1a2e;--steel:#3a4a5a;
      --gold:#c9a96e;--white:#ffffff;
      --text:#f1f5f9;--text-sec:#8fa8bc;--text-mut:#64748b;
      --border:rgba(46,91,118,0.3);--card-bg:rgba(58,74,90,0.55);
      --green:#22c55e;--cyan:#06b6d4;--yellow:#eab308;--red:#ef4444;--purple:#8b5cf6;
      --wpp:#25D366;--wpp-dark:#16a34a;
    }
    html,body{min-height:100%}
    body{font-family:'Sora',sans-serif;background:var(--petrol-deep);color:var(--text);overflow-x:hidden}
    button{transition:all .2s ease;font-family:'Sora',sans-serif}
    a{transition:all .2s ease}
    .bg-glow1{position:fixed;top:-30%;right:-15%;width:55vw;height:55vw;border-radius:50%;
      background:radial-gradient(circle,rgba(255,102,0,0.07) 0%,transparent 65%);pointer-events:none;z-index:0}
    .bg-glow2{position:fixed;bottom:-25%;left:-15%;width:50vw;height:50vw;border-radius:50%;
      background:radial-gradient(circle,rgba(46,91,118,0.18) 0%,transparent 65%);pointer-events:none;z-index:0}
    .grid{position:fixed;inset:0;z-index:0;pointer-events:none;
      background-image:linear-gradient(rgba(46,91,118,0.04) 1px,transparent 1px),linear-gradient(90deg,rgba(46,91,118,0.04) 1px,transparent 1px);background-size:80px 80px}
    .container{max-width:680px;margin:0 auto;padding:40px 20px 60px;position:relative;z-index:1;
      opacity:0;transform:translateY(16px);transition:opacity .35s ease,transform .35s ease}

    .logo-img{width:96px;height:auto;border-radius:10px;display:block;margin:0 auto}
    /* WELCOME */
    .welcome{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:88vh;text-align:center}
    .welcome .divider{width:42px;height:1px;background:rgba(255,102,0,0.45);margin:24px 0}
    .welcome h1{font-size:32px;font-weight:800;color:var(--white);margin:0 0 4px;letter-spacing:-.5px}
    .welcome p.brand{font-size:13px;color:var(--text-sec);margin:0;letter-spacing:2px;font-family:'Space Mono',monospace;text-transform:uppercase}
    .welcome p.intro{font-size:15px;line-height:1.75;color:var(--text-sec);max-width:470px;margin:24px 0 8px}
    .welcome p.intro .o{color:var(--orange);font-weight:600}
    .welcome p.intro .b{color:var(--gold);font-weight:600}
    .welcome input{width:100%;max-width:380px;background:rgba(255,255,255,0.04);border:1.5px solid var(--border);color:var(--white);

    .welcome input:focus{border-color:var(--orange);box-shadow:0 0 0 3px var(--orange-glow)}
    .welcome input::placeholder{color:rgba(143,168,188,0.5)}
    .welcome small{font-size:12px;color:var(--text-mut);margin-top:18px;font-family:'Space Mono',monospace}
    .pill-row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:6px}
    .pill{font-size:11px;color:var(--text-sec);background:rgba(255,255,255,0.04);border:1px solid var(--border);
      padding:6px 12px;border-radius:999px;font-family:'Space Mono',monospace}
    /* BOTÕES */
    .btn-primary{background:linear-gradient(135deg,var(--orange),var(--gold));color:var(--white);border:none;
      padding:15px 52px;border-radius:999px;font-size:15px;font-weight:700;cursor:pointer;
      box-shadow:0 8px 32px rgba(255,102,0,0.35)}
    .btn-primary:hover{transform:translateY(-2px);box-shadow:0 12px 40px rgba(255,102,0,0.45)}
    .btn-primary:disabled{opacity:0.4;cursor:not-allowed;background:rgba(255,255,255,0.10);box-shadow:none;transform:none}
    .btn-wpp{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-width:280px;text-decoration:none;
      background:linear-gradient(135deg,var(--wpp),var(--wpp-dark));color:white;border:none;
      padding:17px 28px;border-radius:999px;font-size:16px;font-weight:700;cursor:pointer;
      box-shadow:0 10px 36px rgba(34,197,94,0.35)}
    .btn-wpp:hover{transform:translateY(-2px);box-shadow:0 14px 40px rgba(34,197,94,0.45)}
    .btn-secondary{background:transparent;color:var(--text-sec);border:1px solid rgba(255,255,255,0.12);
      padding:11px 26px;border-radius:999px;font-size:13px;font-weight:500;cursor:pointer}
    .btn-secondary:hover{border-color:var(--orange);color:var(--orange)}
    .btn-pdf{background:rgba(255,255,255,0.05);color:var(--text);border:1px solid rgba(255,255,255,0.10);
      padding:12px 26px;border-radius:999px;font-size:13px;font-weight:600;cursor:pointer}

    .qhead-left{display:flex;align-items:center;gap:10px}
    .qhead-left img{width:34px;height:34px;border-radius:8px}
    .qhead-left span{font-size:11px;font-weight:600;letter-spacing:2px;text-transform:uppercase;color:var(--text-mut)}
    .qhead-step{font-size:12px;color:var(--text-mut);font-weight:500;font-family:'Space Mono',monospace}
    .progress-bar{width:100%;height:5px;background:rgba(255,255,255,0.06);border-radius:999px;margin-bottom:30px;overflow:hidden}
    .progress-fill{height:100%;border-radius:999px;transition:width .5s cubic-bezier(0.4,0,0.2,1);
      background:linear-gradient(90deg,var(--orange),var(--gold))}
    .back-btn{background:none;border:none;color:var(--text-mut);cursor:pointer;font-size:13px;padding:0;margin-bottom:18px;font-family:'Sora',sans-serif}
    .back-btn:hover{color:var(--orange)}
    .cat-tag{display:inline-flex;border-radius:20px;padding:5px 14px;margin-bottom:18px}
    .cat-tag span{font-size:10px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase}
    .qtitle{display:flex;align-items:flex-start;gap:12px;margin-bottom:8px}
    .qtitle .ic{font-size:26px;line-height:1.1}
    .qtitle h2{font-size:21px;font-weight:700;color:var(--white);margin:0;line-height:1.3}
    .qsubtitle{font-size:14px;color:var(--text-sec);margin:0 0 26px;line-height:1.6}
    .opt-list{display:flex;flex-direction:column;gap:9px}
    .opt-btn{background:rgba(255,255,255,0.025);border:1.5px solid var(--border);border-radius:13px;
      padding:15px 18px;text-align:left;cursor:pointer;color:var(--text);font-size:14px;font-family:'Sora',sans-serif;
      display:flex;align-items:center;gap:14px;line-height:1.45;transition:all .18s ease}
    .opt-btn:hover{border-color:var(--orange);background:rgba(255,102,0,0.05);transform:translateX(3px)}
    .opt-btn.selected{border-color:var(--orange);background:rgba(255,102,0,0.12);box-shadow:0 0 18px rgba(255,102,0,0.12)}
    .radio{width:20px;height:20px;border-radius:50%;flex-shrink:0;border:2px solid rgba(255,255,255,0.18);
      display:flex;align-items:center;justify-content:center;transition:border-color .18s}
    .opt-btn:hover .radio{border-color:var(--orange)}
    .opt-btn.selected .radio{border-color:var(--orange)}
    .radio-dot{width:8px;height:8px;border-radius:50%;background:var(--orange);transform:scale(0);transition:transform .18s}
    .opt-btn.selected .radio-dot{transform:scale(1)}
    .opt-fade{animation:optIn .4s ease both}
    @keyframes optIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
    /* RESULT */
    .result-head{text-align:center;margin-bottom:30px}
    .result-head img{width:52px;height:52px;border-radius:8px;display:block;margin:0 auto}
    .result-head .lbl{font-family:'Space Mono',monospace;font-size:11px;letter-spacing:3px;text-transform:uppercase;color:var(--text-mut);margin:14px 0 6px;font-weight:500}
    .result-head h2{font-size:26px;font-weight:800;color:var(--white);margin:0}
    .profile-hero{text-align:center;border-radius:20px;padding:34px 24px 30px;margin-bottom:26px;position:relative;overflow:hidden}
    .profile-hero .emoji{font-size:42px;display:block;margin-bottom:8px}
    .profile-hero .plbl{font-family:'Space Mono',monospace;font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--text-sec);margin:0 0 4px;font-weight:500}
    .profile-hero h3{font-size:32px;font-weight:800;margin:0 0 12px;letter-spacing:-.5px}
    .profile-hero .pdesc{font-size:14px;line-height:1.7;color:var(--text-sec);max-width:480px;margin:0 auto}
    .gauge-block{display:flex;flex-direction:column;align-items:center;margin:6px 0 24px}
    .scorebadge{font-family:'Space Mono',monospace;font-size:12px;color:var(--text-mut);margin-top:2px}
    .section-card{background:rgba(255,255,255,0.025);border:1px solid rgba(255,255,255,0.06);border-radius:16px;
      padding:22px;margin-bottom:22px}
    .section-card .stitle{font-family:'Space Mono',monospace;font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--gold);margin:0 0 16px;font-weight:600;display:flex;align-items:center;gap:8px}
    .alloc-row{display:flex;align-items:center;gap:14px;margin-bottom:6px}
    .alloc-row .albl{font-size:13px;color:var(--text-sec);width:160px;flex-shrink:0}
    .alloc-bar{flex:1;height:10px;background:rgba(255,255,255,0.05);border-radius:6px;overflow:hidden}
    .alloc-fill{height:100%;border-radius:6px;transition:width 1.1s cubic-bezier(.25,.46,.45,.94)}
    .alloc-val{font-family:'Space Mono',monospace;font-size:13px;font-weight:700;color:var(--white);width:62px;text-align:right}
    .alloc-note{font-size:12px;color:var(--text-mut);margin-top:12px;line-height:1.5;font-style:italic}
    .strong-weak-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
    .sw-col h4{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:1px;margin:0 0 10px}
    .sw-col h4.strong{color:var(--green)}
    .sw-col h4.weak{color:var(--orange)}
    .item-pill{display:flex;align-items:flex-start;gap:8px;padding:10px 12px;border-radius:10px;margin-bottom:8px;font-size:13px;line-height:1.4}
    .item-pill.strong{background:rgba(34,197,94,0.08);border:1px solid rgba(34,197,94,0.2);color:#bbf7d0}
    .item-pill.weak{background:rgba(255,102,0,0.08);border:1px solid rgba(255,102,0,0.2);color:#fed7aa}
    .item-pill .ck{flex-shrink:0;font-weight:700}
    .obs-box{display:flex;gap:12px;padding:14px 16px;border-radius:12px;margin-bottom:10px;font-size:13px;line-height:1.55}
    .obs-box.warn{background:rgba(234,179,8,0.08);border:1px solid rgba(234,179,8,0.25);color:#fef08a}
    .obs-box.info{background:rgba(46,91,118,0.15);border:1px solid var(--border);color:var(--text-sec)}
    .obs-ic{font-size:18px;flex-shrink:0}
    .cat-row{display:flex;align-items:center;gap:10px;margin-bottom:11px}
    .cat-row .cname{font-size:12px;color:var(--text-sec);width:170px;flex-shrink:0}
    .cat-row .cbar{flex:1;height:6px;background:rgba(255,255,255,0.05);border-radius:4px;overflow:hidden}
    .cat-row .cfill{height:100%;border-radius:4px;transition:width 1s ease}
    .cat-row .cpts{font-family:'Space Mono',monospace;font-size:12px;font-weight:600;color:var(--text);width:54px;text-align:right}
    .cta-row{display:flex;flex-direction:column;gap:14px;align-items:center;margin:8px 0 4px}
    .cta-secondary-row{display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap}
    .disclaimer{font-size:11px;color:var(--text-mut);text-align:center;line-height:1.6;margin-top:18px;max-width:520px;margin-left:auto;margin-right:auto}
    @media(max-width:640px){
      .result-head h2{font-size:22px}
      .welcome h1{font-size:26px}
      .profile-hero h3{font-size:26px}
      .strong-weak-grid{grid-template-columns:1fr}
      .cat-row .cname{width:120px;font-size:11px}
      .alloc-row .albl{width:120px;font-size:12px}
      .qtitle h2{font-size:18px}
      .container{padding:24px 16px 44px}
    }
  </style>
</head>

  { id:"q_acompanhamento", cat:"COM", icon:"⏰", title:"Acompanhamento", subtitle:"Com que frequência você acompanha o mercado?",
    options:[
      {label:"Quase nunca, prefiro nem olhar", n:0},
      {label:"Raramente, fico ansioso quando vejo", n:1},
      {label:"De vez em quando, sem me estressar", n:2},
      {label:"Regularmente, com tranquilidade", n:3},
      {label:"Diariamente, acompanho de perto e gosto", n:4},
    ]},
];

// ============================================================
// PERFIS (4) — faixas do score final 0–100
// ============================================================
const PERFIS = [
  { key:"conservador", min:0,  max:30,  nome:"Conservador",     emoji:"🛡️", cor:"#06b6d4",
    desc:"Você prioriza a segurança e a preservação do capital. Em cripto, isso significa uma exposição pequena e cuidadosa, com foco em ativos consolidados e horizonte de longo prazo. Volatilidade forte te incomoda — e tudo bem: a estratégia certa pra você minimiza sustos e protege seu patrimônio.",
    alvo:[0,5], alvoLabel:"0% – 5%" },
  { key:"moderado", min:31, max:55,  nome:"Moderado",         emoji:"⚖️", cor:"#22c55e",
    desc:"Você busca equilíbrio entre risco e retorno. Aceita alguma volatilidade em troca de um potencial de crescimento maior, mas sem abrir mão de uma base sólida. Em cripto, seu perfil combina com uma carteira diversificada, com núcleo em ativos principais e uma fração menor em apostas de maior risco.",
    alvo:[5,15], alvoLabel:"5% – 15%" },
  { key:"agressivo", min:56, max:80,  nome:"Agressivo",        emoji:"🚀", cor:"#ff8533",
    desc:"Você tem alto apetite por risco e busca retornos expressivos, suportando bem a volatilidade do mercado cripto. Tem (ou está construindo) conhecimento e estômago para ciclos intensos. Seu perfil comporta uma exposição relevante, com espaço para ativos de maior risco — sempre com gestão e disciplina.",
    alvo:[15,30], alvoLabel:"15% – 30%" },
  { key:"ultra", min:81, max:100, nome:"Ultra-Agressivo",  emoji:"⚡", cor:"#ef4444",
    desc:"Você é um investidor de altíssimo apetite por risco. Volatilidade extrema é parte do jogo, e você busca o máximo de retorno, topando exposição elevada e ativos de ponta. Esse perfil exige experiência, sangue-frio e gestão de risco impecável — concentração e alavancagem sem critério são os maiores inimigos aqui.",
    alvo:[30,50], alvoLabel:"30%+" },
];

function getPerfil(score) {
  for (const p of PERFIS) if (score >= p.min && score <= p.max) return p;
  return PERFIS[PERFIS.length - 1];
}

// ============================================================
// SCORE PONDERADO
// ============================================================
function calcular() {
  // média de n por categoria (0–4) -> normaliza 0–1
  const catScore = {}; // 0..1 por categoria
  const catRaw = {};   // {soma, count}
  Object.keys(CATEGORIAS).forEach(k => catRaw[k] = { soma: 0, count: 0 });
  STEPS.forEach(s => {
    const n = state.answers[s.id];
    if (typeof n === "number") { catRaw[s.cat].soma += n; catRaw[s.cat].count += 1; }
  });
  Object.keys(catRaw).forEach(k => {
    const r = catRaw[k];
    catScore[k] = r.count ? (r.soma / r.count) / 4 : 0; // 0..1
  });
  // soma ponderada pelos pesos -> 0..100
  let total = 0, somaPesos = 0;
  Object.keys(CATEGORIAS).forEach(k => {
    total += catScore[k] * CATEGORIAS[k].peso;
    somaPesos += CATEGORIAS[k].peso;
  });
  const score = Math.round((total / somaPesos) * 100);
  return { score, catScore };
}

// Pontos fortes / a desenvolver + observações
function analisar(catScore, score) {
  const cats = Object.keys(CATEGORIAS).map(k => ({
    key:k, nome:CATEGORIAS[k].nome, cor:CATEGORIAS[k].cor, val:catScore[k]
  }));
  const fortes = cats.filter(c => c.val >= 0.65).sort((a,b)=>b.val-a.val).slice(0,3);
  const fracos = cats.filter(c => c.val <= 0.4).sort((a,b)=>a.val-b.val).slice(0,3);
  const obs = [];
  // Capacidade financeira baixa + apetite alto = inconsistência
  if (catScore.CAP <= 0.35 && catScore.TOL >= 0.7) {
    obs.push({tipo:"warn", text:"Seu apetite por risco é alto, mas sua capacidade financeira para absorver perdas é limitada. Atenção: invista apenas o que pode perder e evite alavancagem."});
  }
  // Conhecimento baixo + apetite alto
  if (catScore.CON <= 0.35 && catScore.TOL >= 0.7) {
    obs.push({tipo:"warn", text:"Você declara alto apetite por risco, mas ainda está construindo conhecimento. Avançar com calma e estudar antes de grandes posições reduz erros caros."});
  }
  // Origem do capital ruim
  if (state.answers.q_origem === 0) {
    obs.push({tipo:"warn", text:"Investir com capital de empréstimo ou cartão amplifica muito o risco. Recomenda-se fortemente usar apenas capital excedente."});
  }
  // Reserva de emergência
  if (state.answers.q_origem === 1) {
    obs.push({tipo:"info", text:"Cuidado ao alocar sua reserva de emergência em cripto — mantenha um colchão de liquidez seguro e separado."});
  }
  // Comportamento instável
  if (catScore.COM <= 0.35) {
    obs.push({tipo:"info", text:"Reações emocionais a quedas podem atrapalhar seus resultados. Ter um plano e segui-lo é tão importante quanto escolher os ativos certos."});
  }
  // Nunca viveu ciclo + agressivo
  if (state.answers.q_ciclos !== undefined && state.answers.q_ciclos <= 1 && score >= 56) {
    obs.push({tipo:"info", text:"Você ainda não passou por um bear market completo. A tolerância ao risco costuma ser testada de verdade só nessas fases — vá com consciência."});
  }
  return { fortes, fracos, obs };
}

// ============================================================
// STATE
// ============================================================
const state = { step: -1, answers: {}, nome: "" };

// ============================================================
// HELPERS
// ============================================================
function fadeRender(html) {
  const app = document.getElementById("app");
  const old = app.querySelector(".container");
  const apply = () => {
    app.innerHTML = html;
    requestAnimationFrame(() => {
      const c = app.querySelector(".container");
      if (c) c.classList.add("show");
      if (typeof animateGauge === "function") animateGauge();
      if (typeof animateBars === "function") animateBars();
    });
  };
  if (old) { old.classList.remove("show"); setTimeout(apply, 230); }
  else { apply(); }
}
function go(n) { state.step = n; render(); window.scrollTo({top:0, behavior:"smooth"}); }
function pickAnswer(id, n) {
  state.answers[id] = n;
  setTimeout(() => {
    if (state.step < STEPS.length - 1) go(state.step + 1);
    else go(STEPS.length);
  }, 180);
}
function resetAll() { state.answers = {}; go(-1); }
function setNome(v) { state.nome = v; const b = document.getElementById("startBtn"); if (b) b.disabled = !v.trim(); }

// ============================================================
// SCREENS
// ============================================================
function renderWelcome() {
  fadeRender(`
    <div class="container welcome">
      <img src="${LOGO}" alt="Ascen" class="logo-img" />
      <div class="divider"></div>
      <h1>Suitability Cripto</h1>
      <p class="brand">Ascen</p>
      <p class="intro">
        Descubra em poucos minutos o seu
        <span class="o">perfil de risco</span> em criptoativos —
        de <span class="b">Conservador</span> a <span class="b">Ultra-Agressivo</span> —
        com uma análise detalhada e um relatório em PDF.
      </p>
      <input type="text" id="nomeInput" placeholder="Como podemos te chamar?" value="${state.nome.replace(/"/g,'&quot;')}" oninput="setNome(this.value)" />
      <button class="btn-primary" id="startBtn" ${state.nome.trim() ? '' : 'disabled'} onclick="go(0)">Começar</button>
      <div class="pill-row">

        <span class="pill">~3 minutos</span>
        <span class="pill">resultado na hora</span>
      </div>
    </div>
  `);
}

function renderQuestion() {
  const cur = STEPS[state.step];
  const cat = CATEGORIAS[cur.cat];
  const progress = ((state.step + 1) / STEPS.length) * 100;
  const optsHtml = cur.options.map((opt, i) => {
    const sel = state.answers[cur.id] === opt.n;
    return `
      <button class="opt-btn opt-fade ${sel ? 'selected' : ''}" style="animation-delay:${i*0.05}s" onclick="pickAnswer('${cur.id}', ${opt.n})">
        <span class="radio"><span class="radio-dot"></span></span>
        <span>${opt.label}</span>
      </button>`;
  }).join("");
  fadeRender(`
    <div class="container">
      <div class="qhead">
        <div class="qhead-left"><img src="${LOGO}" alt=""><span>Suitability</span></div>
        <span class="qhead-step">${state.step + 1} / ${STEPS.length}</span>
      </div>
      <div class="progress-bar"><div class="progress-fill" style="width:${progress}%"></div></div>
      ${state.step > 0 ? '<button class="back-btn" onclick="go('+(state.step-1)+')">← Voltar</button>' : ''}
      <div class="cat-tag" style="background:${cat.cor}14;border:1px solid ${cat.cor}33">
        <span style="color:${cat.cor}">${cat.icon} ${cat.nome}</span>
      </div>
      <div class="qtitle"><span class="ic">${cur.icon}</span><h2>${cur.subtitle}</h2></div>
      <div class="opt-list">${optsHtml}</div>
    </div>
  `);
}

// ---- Gauge semicircular animado ----
let _gaugePending = null;
function gaugeSVG(score, color) {
  const r = 80;
  const circ = Math.PI * r;
  const off = circ - (score / 100) * circ;
  const uid = "gz_" + Math.random().toString(36).slice(2,8);
  _gaugePending = { uid, off };
  return `
    <svg width="220" height="128" viewBox="0 0 220 128">
      <defs>
        <linearGradient id="${uid}_g" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0%" stop-color="#06b6d4"/>
          <stop offset="50%" stop-color="#ff6600"/>
          <stop offset="100%" stop-color="#ef4444"/>
        </linearGradient>
      </defs>
      <path d="M 20 112 A 90 90 0 0 1 200 112" fill="none" stroke="rgba(255,255,255,0.07)" stroke-width="14" stroke-linecap="round"/>
      <path id="${uid}" d="M 20 112 A 90 90 0 0 1 200 112" fill="none" stroke="url(#${uid}_g)" stroke-width="14" stroke-linecap="round"
        stroke-dasharray="${circ}" stroke-dashoffset="${circ}"
        style="transition: stroke-dashoffset 1.5s cubic-bezier(0.25,0.46,0.45,0.94)"/>
      <text x="110" y="96" text-anchor="middle" fill="${color}" font-family="Sora" font-size="44" font-weight="800">${score}</text>
      <text x="110" y="118" text-anchor="middle" fill="#64748b" font-family="Space Mono" font-size="12" letter-spacing="1">/ 100</text>
    </svg>`;
}
function animateGauge() {
  if (!_gaugePending) return;
  const { uid, off } = _gaugePending; _gaugePending = null;
  setTimeout(() => { const n = document.getElementById(uid); if (n) n.setAttribute("stroke-dashoffset", String(off)); }, 220);
}
// anima barras (alocação / categorias) que começam em width:0
function animateBars() {
  setTimeout(() => {
    document.querySelectorAll("[data-fill]").forEach(b => { b.style.width = b.getAttribute("data-fill") + "%"; });
  }, 240);
}

function renderResult() {
  const { score, catScore } = calcular();
  const p = getPerfil(score);
  const an = analisar(catScore, score);

  const catBars = Object.keys(CATEGORIAS).map(k => {
    const c = CATEGORIAS[k];
    const pct = Math.round(catScore[k] * 100);
    return `
      <div class="cat-row">
        <span class="cname">${c.icon} ${c.nome}</span>
        <div class="cbar"><div class="cfill" data-fill="${pct}" style="width:0;background:${c.cor}"></div></div>
        <span class="cpts">${pct}%</span>
      </div>`;
  }).join("");

  const fortesHtml = an.fortes.length
    ? an.fortes.map(f=>`<div class="item-pill strong"><span class="ck">✓</span><span>${f.nome}</span></div>`).join("")
    : '<div class="item-pill" style="background:rgba(255,255,255,0.03);border:1px solid var(--border);color:var(--text-mut);font-style:italic">Perfil equilibrado entre as categorias.</div>';
  const fracosHtml = an.fracos.length
    ? an.fracos.map(f=>`<div class="item-pill weak"><span class="ck">!</span><span>${f.nome}</span></div>`).join("")
    : '<div class="item-pill" style="background:rgba(255,255,255,0.03);border:1px solid var(--border);color:var(--text-mut);font-style:italic">Nenhuma fragilidade marcante.</div>';
  const obsHtml = an.obs.length
    ? an.obs.map(o=>`<div class="obs-box ${o.tipo==='warn'?'warn':'info'}"><span class="obs-ic">${o.tipo==='warn'?'⚠️':'ℹ️'}</span><span>${o.text}</span></div>`).join("")
    : '<div class="obs-box info"><span class="obs-ic">✓</span><span>Nenhum ponto de atenção relevante identificado. Bom equilíbrio entre apetite e capacidade de risco.</span></div>';

  // mensagem WhatsApp
  const wppMsg =
`${p.emoji} *Perfil ${p.nome}* (${score}/100)
Olá! Acabei de fazer o teste de perfil de risco em cripto da Ascen.
Meu resultado foi *${p.nome}*, com sugestão de exposição a cripto de *${p.alvoLabel}*.
${state.nome ? "Meu nome é " + state.nome + ". " : ""}Gostaria de conversar sobre como montar uma estratégia adequada ao meu perfil.`;
  const wppHref = `${WHATSAPP_BASE}?text=${encodeURIComponent(wppMsg)}`;

  // salva pro PDF
  window._resultData = {
    nome: state.nome || "Investidor(a)",
    score, perfil: p.nome, emoji: p.emoji, cor: p.cor,
    descricao: p.desc, alvoLabel: p.alvoLabel,
    cats: Object.keys(CATEGORIAS).map(k=>({nome:CATEGORIAS[k].nome, pct:Math.round(catScore[k]*100)})),
    fortes: an.fortes.map(f=>f.nome),
    fracos: an.fracos.map(f=>f.nome),
    obs: an.obs.map(o=>o.text),
  };

  const allocFillL = (p.alvo[0]/50)*100;
  const allocFillR = (p.alvo[1]/50)*100;

  fadeRender(`
    <div class="container">
      <div class="result-head">
        <img src="${LOGO}" alt="">
        <p class="lbl">Seu resultado${state.nome ? " · " + state.nome : ""}</p>
        <h2>Perfil de Risco em Cripto</h2>
      </div>

      <div class="profile-hero" style="background:linear-gradient(135deg, ${p.cor}1c, ${p.cor}08);border:1px solid ${p.cor}40">
        <div class="gauge-block">${gaugeSVG(score, p.cor)}</div>
        <span class="emoji">${p.emoji}</span>
        <p class="plbl">Seu perfil é</p>
        <h3 style="color:${p.cor}">${p.nome}</h3>
        <p class="pdesc">${p.desc}</p>
      </div>

      <div class="section-card">
        <p class="stitle">🎯 Exposição sugerida a cripto</p>
        <div class="alloc-row">
          <span class="albl">Faixa do seu perfil</span>
          <div class="alloc-bar">
            <div class="alloc-fill" data-fill="${allocFillR}" style="width:0;background:linear-gradient(90deg,${p.cor}77,${p.cor})"></div>
          </div>
          <span class="alloc-val">${p.alvoLabel}</span>
        </div>
        <p class="alloc-note">Percentual sugerido do seu patrimônio total exposto a criptoativos, de acordo com o seu perfil. Caráter educativo — não é recomendação de investimento.</p>
      </div>

      <div class="section-card">
        <p class="stitle">📊 Seu perfil por categoria</p>
        ${catBars}
      </div>

      <div class="section-card">
        <p class="stitle">⚖️ Pontos fortes e a desenvolver</p>
        <div class="strong-weak-grid">
          <div class="sw-col"><h4 class="strong">✓ Mais fortes</h4>${fortesHtml}</div>
          <div class="sw-col"><h4 class="weak">! A desenvolver</h4>${fracosHtml}</div>
        </div>
      </div>

      <div class="section-card">
        <p class="stitle">🔎 Observações pra você</p>
        ${obsHtml}
      </div>

      <div class="cta-row">
        <a href="${wppHref}" target="_blank" rel="noopener noreferrer" class="btn-wpp">💬 Falar com a Ascen no WhatsApp</a>
        <div class="cta-secondary-row">
          <button class="btn-pdf" onclick="gerarPDF()">📄 Baixar relatório em PDF</button>
          <button class="btn-secondary" onclick="resetAll()">↻ Refazer teste</button>
        </div>
      </div>
      <p class="disclaimer">Este questionário tem caráter exclusivamente educativo e serve para identificar seu perfil de exposição ao mercado de criptoativos. Não constitui recomendação ou oferta de investimento.</p>
    </div>
  `);
}

function render() {
  if (state.step === -1) return renderWelcome();
  if (state.step >= STEPS.length) return renderResult();
  return renderQuestion();
}

// ============================================================
// PDF — relatório de várias seções
// ============================================================
function hexToRgb(h){ h=h.replace('#',''); return [parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)]; }
function gerarPDF() {
  const d = window._resultData; if (!d) return;
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ orientation:"portrait", unit:"mm", format:"a4" });
  const W = 210;
  const [pr,pg,pb] = hexToRgb(d.cor);

  // ----- CAPA / TOPO -----
  doc.setFillColor(10,26,46); doc.rect(0,0,W,46,"F");
  doc.setTextColor(255,102,0); doc.setFont("helvetica","bold"); doc.setFontSize(24);
  doc.text("ASCEN", 20, 22);
  doc.setTextColor(201,169,110); doc.setFontSize(10); doc.setFont("helvetica","normal");
  doc.text("RELATÓRIO DE PERFIL DE RISCO EM CRIPTO", 20, 30);
  doc.setTextColor(255,255,255); doc.setFontSize(9);
  doc.text("Investidor(a): " + d.nome, 20, 38);
  const hoje = new Date().toLocaleDateString("pt-BR");
  doc.text("Data: " + hoje, W-20, 38, {align:"right"});

  let y = 62;

  // ----- BLOCO PERFIL -----
  doc.setFillColor(pr,pg,pb);
  doc.roundedRect(20, y-8, W-40, 30, 3, 3, "F");
  doc.setTextColor(255,255,255); doc.setFont("helvetica","bold"); doc.setFontSize(20);
  doc.text(`${d.perfil}`, 28, y+4);
  doc.setFontSize(11); doc.setFont("helvetica","normal");
  doc.text(`Score: ${d.score}/100`, 28, y+13);
  doc.setFontSize(11); doc.setFont("helvetica","bold");
  doc.text(`Exposição sugerida: ${d.alvoLabel}`, W-28, y+9, {align:"right"});
  y += 34;

  // ----- DESCRIÇÃO -----
  doc.setTextColor(40,40,40); doc.setFont("helvetica","bold"); doc.setFontSize(12);
  doc.text("Sobre o seu perfil", 20, y); y += 6;
  doc.setFont("helvetica","normal"); doc.setFontSize(10); doc.setTextColor(70,70,70);
  const desc = doc.splitTextToSize(d.descricao, W-40);
  doc.text(desc, 20, y); y += desc.length*5 + 8;

  // ----- CATEGORIAS (barras) -----
  doc.setTextColor(40,40,40); doc.setFont("helvetica","bold"); doc.setFontSize(12);
  doc.text("Seu perfil por categoria", 20, y); y += 7;
  doc.setFontSize(9); doc.setFont("helvetica","normal");
  d.cats.forEach(c => {
    doc.setTextColor(70,70,70);
    doc.text(c.nome, 20, y);
    // barra
    doc.setFillColor(230,230,230); doc.roundedRect(95, y-3.2, 85, 4, 1.5, 1.5, "F");
    doc.setFillColor(pr,pg,pb); doc.roundedRect(95, y-3.2, Math.max(2,85*(c.pct/100)), 4, 1.5, 1.5, "F");
    doc.setTextColor(40,40,40); doc.text(c.pct + "%", W-20, y, {align:"right"});
    y += 7;
  });
  y += 4;

  // ----- FORTES / A DESENVOLVER -----
  if (d.fortes.length || d.fracos.length) {
    doc.setTextColor(40,40,40); doc.setFont("helvetica","bold"); doc.setFontSize(12);
    doc.text("Pontos fortes e a desenvolver", 20, y); y += 6;
    doc.setFontSize(10); doc.setFont("helvetica","normal");
    if (d.fortes.length) {
      doc.setTextColor(34,139,34); doc.setFont("helvetica","bold");
      doc.text("Mais fortes:", 20, y); y += 5;
      doc.setFont("helvetica","normal"); doc.setTextColor(70,70,70);
      d.fortes.forEach(f => { doc.text("•  " + f, 24, y); y += 5; });
    }
    if (d.fracos.length) {
      y += 1;
      doc.setTextColor(255,102,0); doc.setFont("helvetica","bold");
      doc.text("A desenvolver:", 20, y); y += 5;
      doc.setFont("helvetica","normal"); doc.setTextColor(70,70,70);
      d.fracos.forEach(f => { doc.text("•  " + f, 24, y); y += 5; });
    }
    y += 4;
  }

  // ----- OBSERVAÇÕES -----
  if (d.obs.length) {
    if (y > 250) { doc.addPage(); y = 22; }
    doc.setTextColor(40,40,40); doc.setFont("helvetica","bold"); doc.setFontSize(12);
    doc.text("Observações", 20, y); y += 6;
    doc.setFont("helvetica","normal"); doc.setFontSize(9.5); doc.setTextColor(70,70,70);
    d.obs.forEach(o => {
      const lines = doc.splitTextToSize("•  " + o, W-44);
      if (y + lines.length*5 > 275) { doc.addPage(); y = 22; }
      doc.text(lines, 22, y); y += lines.length*5 + 2;
    });
    y += 2;
  }

  // ----- WHATSAPP / CTA -----
  if (y > 250) { doc.addPage(); y = 22; }
  doc.setFillColor(37,211,102); doc.roundedRect(20, y, W-40, 16, 3, 3, "F");
  doc.setTextColor(255,255,255); doc.setFont("helvetica","bold"); doc.setFontSize(11);
  doc.text("Fale com a Ascen: +55 11 91753-6554", W/2, y+10, {align:"center"});
  y += 24;

  // ----- RODAPÉ / DISCLAIMER -----
  doc.setDrawColor(210,210,210); doc.line(20, y, W-20, y); y += 6;
  doc.setFont("helvetica","italic"); doc.setFontSize(8); doc.setTextColor(120,120,120);
  const aviso = "Este relatório tem caráter exclusivamente educativo e serve para identificar o perfil de exposição ao mercado de criptoativos. Não constitui recomendação ou oferta de investimento. Cripto é um mercado de alto risco; invista de forma consciente.";
  const avLines = doc.splitTextToSize(aviso, W-40);
  doc.text(avLines, 20, y);

  doc.save(`perfil-cripto-${(d.nome||"ascen").toLowerCase().replace(/\s+/g,"-")}.pdf`);
}

// ============================================================
// BOOT
// ============================================================
render();

</script>
